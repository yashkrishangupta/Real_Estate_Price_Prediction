<!DOCTYPE html>
<html>
<head>
    <title>Property Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Property Price Predictor</h1>

    <!-- City -->
    <select id="city" onchange="updateSuburban()">
        <option value="">Select City</option>
        {% for city in city_mapping.keys() %}
        <option value="{{ city }}">{{ city }}</option>
        {% endfor %}
    </select>

    <!-- Suburban -->
    <select id="suburban" onchange="updateLocality()"></select>

    <!-- Locality -->
    <select id="locality"></select>

    <!-- Property Type -->
    <select id="property_type" onchange="handlePropertyType()">
        <option value="">Property Type</option>
        <option>Apartment</option>
        <option>Independent House</option>
        <option>Villa</option>
        <option>Independent Floor</option>
        <option>Residential Plot</option>
    </select>

    <!-- Studio -->
    <div id="studio_div">
        <select id="is_studio">
            <option value="0">Studio No</option>
            <option value="1">Studio Yes</option>
        </select>
    </div>

    <!-- Penthouse -->
    <div id="penthouse_div">
        <select id="is_PentaHouse">
            <option value="0">Penthouse No</option>
            <option value="1">Penthouse Yes</option>
        </select>
    </div>

    <input type="number" id="bhk" placeholder="BHK">
    <input type="number" id="area_sqft" placeholder="Area (sqft)">

    <select id="status">
        <option>ACTIVE</option>
        <option>UNVERIFIED</option>
        <option>INACTIVE</option>
    </select>

    <select id="furnished">
        <option>Furnished</option>
        <option>Semi-Furnished</option>
        <option>Unfurnished</option>
    </select>

    <input type="range" min="0" max="10" step="0.1" id="trust_score">

    <button onclick="predict()">Predict</button>

    <h2 id="result"></h2>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
    const cityMapping = {{ city_mapping | tojson }};
</script>

</body>
</html>
