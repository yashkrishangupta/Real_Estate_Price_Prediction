<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page-wrapper">

    <header class="hero">
        <div class="hero-content">
            <div class="hero-icon">🏠</div>
            <h1>Property Price Predictor</h1>
            <p>Get an instant AI-powered estimate for any property across India</p>
        </div>
    </header>

    <main class="form-wrapper">

        <!-- Section 1: Location -->
        <div class="card">
            <div class="card-header">
                <span class="card-icon">📍</span>
                <h2>Location</h2>
            </div>
            <div class="card-body">
                <div class="form-grid three-col">
                    <div class="field">
                        <label for="city">City</label>
                        <select id="city" onchange="updateSuburban()">
                            <option value="">Select City</option>
                            {% for city in city_mapping.keys() %}
                            <option value="{{ city }}">{{ city }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field">
                        <label for="suburban">Sub-Urban</label>
                        <select id="suburban" onchange="updateLocality()">
                            <option value="">Select Sub-Urban</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="locality">Locality</label>
                        <select id="locality">
                            <option value="">Select Locality</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 2: Property Details -->
        <div class="card">
            <div class="card-header">
                <span class="card-icon">🏗️</span>
                <h2>Property Details</h2>
            </div>
            <div class="card-body">
                <div class="form-grid two-col">
                    <div class="field">
                        <label for="property_type">Property Type</label>
                        <select id="property_type" onchange="handlePropertyType()">
                            <option value="">Select Type</option>
                            <option>Apartment</option>
                            <option>Independent House</option>
                            <option>Villa</option>
                            <option>Independent Floor</option>
                            <option>Residential Plot</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="status">Building Status</label>
                        <select id="status">
                            <option>ACTIVE</option>
                            <option>UNVERIFIED</option>
                            <option>INACTIVE</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="bhk">BHK</label>
                        <input type="number" id="bhk" placeholder="e.g. 2" min="1" max="10">
                    </div>
                    <div class="field">
                        <label for="area_sqft">Area (sqft)</label>
                        <input type="number" id="area_sqft" placeholder="e.g. 1200" min="1">
                    </div>
                    <div class="field">
                        <label for="furnished">Furnishing</label>
                        <select id="furnished">
                            <option>Furnished</option>
                            <option>Semi-Furnished</option>
                            <option>Unfurnished</option>
                        </select>
                    </div>
                </div>

                <!-- Conditional: Studio & Penthouse -->
                <div id="studio_div" class="hidden field toggle-field">
                    <label>Studio Apartment?</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-target="is_studio" data-val="0" onclick="setToggle(this, 'is_studio', 0)">No</button>
                        <button class="toggle-btn" data-target="is_studio" data-val="1" onclick="setToggle(this, 'is_studio', 1)">Yes</button>
                    </div>
                    <input type="hidden" id="is_studio" value="0">
                </div>

                <div id="penthouse_div" class="hidden field toggle-field">
                    <label>Penthouse?</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-target="is_PentaHouse" data-val="0" onclick="setToggle(this, 'is_PentaHouse', 0)">No</button>
                        <button class="toggle-btn" data-target="is_PentaHouse" data-val="1" onclick="setToggle(this, 'is_PentaHouse', 1)">Yes</button>
                    </div>
                    <input type="hidden" id="is_PentaHouse" value="0">
                </div>
            </div>
        </div>

        <!-- Section 3: Flags & Trust -->
        <div class="card">
            <div class="card-header">
                <span class="card-icon">✅</span>
                <h2>Listing Flags</h2>
            </div>
            <div class="card-body">
                <div class="flags-grid">
                    <div class="flag-item">
                        <label>RERA Registered</label>
                        <div class="toggle-group">
                            <button class="toggle-btn active" onclick="setToggle(this, 'is_RERA_registered', 0)">No</button>
                            <button class="toggle-btn" onclick="setToggle(this, 'is_RERA_registered', 1)">Yes</button>
                        </div>
                        <input type="hidden" id="is_RERA_registered" value="0">
                    </div>
                    <div class="flag-item">
                        <label>Ready to Move</label>
                        <div class="toggle-group">
                            <button class="toggle-btn active" onclick="setToggle(this, 'is_ready_to_move', 0)">No</button>
                            <button class="toggle-btn" onclick="setToggle(this, 'is_ready_to_move', 1)">Yes</button>
                        </div>
                        <input type="hidden" id="is_ready_to_move" value="0">
                    </div>
                </div>

                <div class="field slider-field">
                    <label for="trust_score">
                        Trust Score
                        <span class="slider-value" id="trust_display">5.0</span>
                    </label>
                    <input type="range" min="0" max="10" step="0.1" value="5" id="trust_score"
                           oninput="document.getElementById('trust_display').innerText = parseFloat(this.value).toFixed(1)">
                    <div class="slider-labels"><span>0</span><span>5</span><span>10</span></div>
                </div>
            </div>
        </div>

        <!-- Predict Button -->
        <button class="predict-btn" onclick="predict()" id="predict_btn">
            <span id="btn_text">Get Price Estimate</span>
            <span id="btn_loader" class="hidden">Calculating…</span>
        </button>

        <!-- Result -->
        <div id="result_card" class="result-card hidden">
            <div class="result-label">Estimated Property Price</div>
            <div class="result-price" id="result_price"></div>
            <div class="result-note">*AI estimate based on provided features</div>
        </div>

        <!-- Error -->
        <div id="error_card" class="error-card hidden">
            <span>⚠️</span> <span id="error_msg">Something went wrong. Please fill all fields.</span>
        </div>

    </main>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
    const cityMapping = {{ city_mapping | tojson }};
</script>
</body>
</html>
